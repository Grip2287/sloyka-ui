name: Release
# Запускается только после успешного CI на main: непроверенный код не публикуется.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: { contents: write, packages: write, pull-requests: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # тот же образ, что в CI: в нём есть браузер для тестов разбора референсов
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.event.workflow_run.head_sha }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: 'https://npm.pkg.github.com', scope: '@grip2287' }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci && npm run build && npm test
      # Changesets открывает PR «Version Packages»; после его слияния публикует новую версию в GitHub Packages.
      # Чтобы на этом PR тоже запускался CI, добавьте секрет CHANGESETS_TOKEN (личный токен с repo):
      # PR, открытый встроенным GITHUB_TOKEN, проверки не запускает.
      - uses: changesets/action@v1
        with: { publish: npx changeset publish }
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
