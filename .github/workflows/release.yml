name: Release
# Запускается только после успешного CI на main: непроверенный код не публикуется.
# 1) Есть ожидающие changeset → PR «Version Packages» с новой версией и заметками «Что нового и где лежит».
# 2) PR слит → публикация на npmjs.com через доверенную публикацию (OIDC, без токена) и выпуск на GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: { contents: write, pull-requests: write, id-token: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.event.workflow_run.head_sha }}', fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci && npm run build && npm test
      # Манифест последней опубликованной версии — для заметок «Что нового и где лежит».
      # Лежит вне репозитория: changesets/action сбрасывает рабочую копию перед `version`.
      - name: Previous manifest
        run: |
          if TARBALL=$(npm view sloyka dist.tarball 2>/dev/null) && [ -n "$TARBALL" ]; then
            mkdir -p /tmp/prev && curl -sL "$TARBALL" | tar -xz -C /tmp/prev && ls /tmp/prev/package/components.json
          else echo "sloyka ещё не опубликован — первый выпуск"; fi
      # Доверенная публикация (OIDC) работает с npm 11.5.1 и новее; у Node 22 npm старее.
      # Ставим после тестов: сборка и тесты идут на npm, который идёт с Node.
      - run: npm install -g npm@11 && npm --version
      - uses: changesets/action@v1
        with:
          version: npm run version:release
          publish: npx changeset publish
          createGithubReleases: true
        env:
          # Чтобы на PR «Version Packages» запускался CI, добавьте секрет CHANGESETS_TOKEN (личный токен с repo).
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
