name: Release
on:
  push: { branches: [main] }
permissions: { contents: write, packages: write, pull-requests: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://npm.pkg.github.com', scope: '@grip2287' }
      - run: npm ci && npm run build
      # Changesets: открывает PR «Version Packages»; после его слияния публикует новую версию в GitHub Packages.
      - uses: changesets/action@v1
        with: { publish: npx changeset publish }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
