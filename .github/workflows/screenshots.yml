name: Update screenshots
on: workflow_dispatch
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci && npm run build && npm run build-storybook
      - run: npx playwright test --update-snapshots || true
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__/linux
          git commit -m "test: update linux screenshots" || echo "no changes"
          git push
