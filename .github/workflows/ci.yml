name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook
      # Переполнение, обрезка, axe и поведение проверяются всегда. Скриншоты сравниваются,
      # когда в репозитории есть эталоны для linux (создаются вручным запуском workflow «Update screenshots»).
      - run: |
          if [ -d tests/e2e/__screenshots__/linux ]; then npx playwright test; else npx playwright test --ignore-snapshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: storybook, path: storybook-static, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
