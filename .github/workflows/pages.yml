name: Storybook on GitHub Pages
# Витрина компонентов: https://grip2287.github.io/sloyka-ui/
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.event.workflow_run.head_sha || github.sha }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci && npm run build && npm run build-storybook
      - uses: actions/upload-pages-artifact@v4
        with: { path: storybook-static }
      - id: deploy
        uses: actions/deploy-pages@v4
